<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut &amp; Co | Book</title>
    <meta name="description" content="Choose a service, barber, date, and time to book your haircut online at Cut &amp; Co.">

    <!-- Favicon -->
    <link rel="icon" href="favicon/favicon.ico">
    
    <!-- Social Media (Open Graph) Meta Tags -->
    <meta property="og:title" content="WDD330 | Cut &amp; Co | Book | Albert Fiati">
    <meta property="og:description" content="Choose a service, barber, date, and time to book your haircut at Cut &amp; Co. at your own comfort zone.">
    <meta property="og:image" content="https://fiatiab47-jk.github.io/WDD330-projects/barbershop-booking-app-project/images/logos/scissors.svg">
    <meta property="og:url" content="https://fiatiab47-jk.github.io/WDD330-projects/barbershop-booking-app-project/booking.html">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">

     <!-- CSS -->
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/small.css">
    <link rel="stylesheet" href="css/medium.css" media="(min-width: 768px)">
    <link rel="stylesheet" href="css/large.css" media="(min-width: 1024px)">
    <link rel="stylesheet" href="css/animations.css">

    <!-- JS -->
    <script type="module" src="js/booking.js"></script>
</head>

<!-- Body Start -->
<body>
    <!-- Share header for all pages -->
    <header id="site-header"></header>

    <!-- Main -->
    <main>
        <h1>Book Your Cut</h1>
        
        <form action="" id="booking-form">
            <fieldset>
                <legend>Choose a service</legend>
                <div id="service-options"></div>
            </fieldset>

            <fieldset>
                <legend>Choose a barber</legend>
                <div id="barber-options"></div>
            </fieldset>

            <div>
                <label for="booking-date">choose a date</label>
                <input type="date" id="booking-date" name="date" required>
                <p id="holiday-message" aria-live="polite"></p>
                <p id="weather-message" aria-live="polite"></p>
            </div>

            <fieldset>
                <legend>Choose a time</legend>
                <div id="time-slots"></div>
            </fieldset>

            <label for="customer-name">Name</label>
            <input type="text" name="name" id="customer-name"required>

            <label for="customer-phone">Phone</label>
            <input type="tel" name="phone" id="customer-phone" required>

            <button type="submit">Book Now</button>
        </form>
    </main>

    <!-- Shared footer loads here -->
    <footer id="site-footer"></footer>
</body>       
</html>
